name: Stack

version: '3'

services:
  reverse-proxy:
    image: traefik:v3.2
    command:
      - "--api=true"
      - "--api.insecure=false"
      - "--providers.docker"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=michal.korzeniewskiii@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./letsencrypt:/letsencrypt 
      - /var/run/docker.sock:/var/run/docker.sock
  api:
    image: cubeofdestiny/api-image
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    labels:
      - "traefik.enable=true" #epickaporownywarkabazwiedzyuczelni.rocks
      - "traefik.http.routers.app.rule=Host(`epickaporownywarkabazwiedzyuczelni.rocks`)"
      - "traefik.http.services.app.loadbalancer.server.port=8080"
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: 
     - "interval 3600"
  whoami:  
    image: traefik/whoami  
    labels:  
      - "traefik.http.routers.whoami.rule=Host(`whoami.epickaporownywarkabazwiedzyuczelni.rocks`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls.certresolver=myresolver"


